<div class="row animated fadeIn fast" *ngIf="cargando">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <div class="alert alert-info text-center" role="alert">
          <h4 class="alert-heading">Cargando</h4>
          <i class="fa fa-spin fa-refresh fa-2x"></i>
          <p class="mb-0">Por favor espere...</p>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="row" *ngIf="!cargando">
  <!-- <div class="col-12 mb-4">
    <button class="btn btn-primary" (click)="newUnidad()">
      Nuevo
    </button>
  </div> -->
  <div class="col-12">
    <h4 class="d-inline">Rol {{ rol.data.name}}</h4>
    <p class="text-muted m-t-0">Gestión de Permisos</p>
  </div>
  <div class="col-12">
    <div class="row">

    </div>
    <div class="col-4">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title">Nombre Permiso </h4>
          <h6 class="card-subtitle">Permisos</h6>
          <div>
            <div *ngFor="let permiso of permisos">
              <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" [id]="'permiso'+permiso.id"
                [checked]="permisosAsignados.includes(permiso.id)"
                (change)="onChange(permiso.id, $event)">
                <label class="custom-control-label" [for]="'permiso'+permiso.id">{{ permiso.name }}</label>
                <!-- [checked]="rolPermisos.includes(permiso.id)" -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-12 text-center mt-4">
    <button class="btn btn-success" (click)="guardar()">Guardar</button>
  </div>
</div>
