<div [class.oculto]="stateModal" class="fondo-modal animated fadeIn fast" [ngClass]="{'fadeOut': stateModal, 'fadeIn': !stateModal }">
  <form [formGroup]="profesionForm" (ngSubmit)="save()">
    <app-modal-structure [title]="title ? 'Nueva Profesion': 'Editar Profesion'">
      <div ngProjectAs="card-content">
        <div class="row">
          <div class="col-sm-12 col-xs-12">
            <div class="form-group"
              [class.has-danger]="profesionForm.get('nombre').invalid && profesionForm.get('nombre').touched">
              <label for="InputNombre" class="form-control-label">Nombre :</label>
              <input type="text" formControlName="nombre" class="form-control" id="InputNombre"
                placeholder="nombre de la profesion">

              <div *ngIf="FormErrorHelper.getError(profesionForm.get('nombre')) as error">
                <div class="form-control-feedback">{{ error }}</div>
              </div>
            </div>
            <div class="form-group"
              [class.has-danger]="profesionForm.get('tipo').invalid && profesionForm.get('tipo').touched">
              <label for="SelectTipo" class="form-control-label">Tipo</label>
              <select id="SelectTipo" class="form-control" formControlName="tipo">
                <option [ngValue]="null" disabled>Selecciona una opcion</option>
                <option *ngFor="let tipo of tipos" [value]="tipo">{{ tipo }}</option>
              </select>
              <div *ngIf="FormErrorHelper.getError(profesionForm.get('tipo')) as error">
                <div class="form-control-feedback">{{ error }}</div>
              </div>
            </div>
            <div class="form-group"
              [class.has-danger]="profesionForm.get('estado').invalid && profesionForm.get('estado').touched">
              <label for="SelectEstado" class="form-control-label">Estado</label>
              <select id="SelectEstado" class="form-control" formControlName="estado">
                <option [ngValue]="null" disabled>Selecciona una opcion</option>
                <option *ngFor="let estado of estados" [value]="estado">{{ estado }}</option>
              </select>
              <div *ngIf="FormErrorHelper.getError(profesionForm.get('estado')) as error">
                <div class="form-control-feedback">{{ error }}</div>
              </div>
            </div>
          </div>

        </div>
      </div>
      <div class="modal-footer" ngProjectAs="modal-footer">
        <button (click)="onCloseModal()" type="button" class="btn btn-secondary" data-dismiss="modal">
          Cerrar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="!profesionForm.valid">Guardar</button>
      </div>
    </app-modal-structure>
  </form>
</div>
